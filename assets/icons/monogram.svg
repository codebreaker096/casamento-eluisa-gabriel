<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="oliveGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F4E36" />
      <stop offset="50%" stop-color="#4D5D43" />
      <stop offset="100%" stop-color="#34412C" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g id="monogram-content" text-anchor="middle" fill="url(#oliveGoldGrad)" filter="url(#subtleShadow)">
    <!-- Monogram letters E & G -->
    <text x="170" y="165" font-family="'Playfair Display', 'Cormorant Garamond', 'Didot', 'Cinzel', serif" font-size="140" font-weight="400" font-style="italic" letter-spacing="-2">E</text>
    <text x="250" y="145" font-family="'Cormorant Garamond', 'Playfair Display', 'Alex Brush', cursive, serif" font-size="105" font-weight="300" font-style="italic">&amp;</text>
    <text x="330" y="165" font-family="'Playfair Display', 'Cormorant Garamond', 'Didot', 'Cinzel', serif" font-size="140" font-weight="400" font-style="italic" letter-spacing="-2">G</text>

    <!-- Refined separator line -->
    <rect x="160" y="210" width="180" height="3" rx="1.5" fill="#4D5D43" />

    <!-- Date formatted 17 . 01 . 2027 -->
    <text x="250" y="255" dx="-4.5" font-family="'Montserrat', 'Cinzel', sans-serif" font-size="22" font-weight="400" letter-spacing="9" fill="#4D5D43">17 · 01 · 2027</text>
  </g>
</svg>
